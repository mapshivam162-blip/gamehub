<!DOCTYPE html>

<html lang="hi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#0d1526"/>
<meta name="description" content="Khelog community game"/>
<link rel="icon" type="image/svg+xml" href="icon.svg"/>
<title>Khelog — Community Game</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d1526;
    font-family: 'Plus Jakarta Sans', sans-serif;
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: #16233f; color: #fff;
    border-bottom: 2px solid #2a3b5e; flex: 0 0 auto;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  #bar .t { flex: 1; min-width: 0; }
  #bar .title { font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .sub { font-size: 10px; font-weight: 700; color: #8fa8cc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbtn {
    border: 2px solid #3e5f8a; background: #1e3a5f; color: #fff;
    border-radius: 10px; padding: 6px 10px; font-family: inherit;
    font-size: 11px; font-weight: 800; cursor: pointer; line-height: 1.2;
  }
  .pbtn:active { background: #3e5f8a; }
  .pbtn.gold { border-color: #b8860b; background: #3d2f05; color: #ffd740; }
  #frame-wrap { flex: 1 1 auto; min-height: 0; background: #000; }
  #gframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; color: #8fa8cc; font-weight: 800; font-size: 13px;
    background: radial-gradient(ellipse at 50% 40%, #17233c 0%, #0d1424 70%);
    opacity: 1; transition: opacity .35s ease; z-index: 5;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  .load-emoji {
    font-size: 52px; line-height: 1;
    animation: loadBounce 1.1s cubic-bezier(.36,.07,.19,.97) infinite alternate;
    filter: drop-shadow(0 6px 14px rgba(80,140,255,.35));
  }
  @keyframes loadBounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-14px) scale(1.08); }
  }
  .load-title { font-size: 13px; color: #a8c0e0; letter-spacing: .3px; }
  .load-bar {
    width: 62%; max-width: 260px; height: 10px; border-radius: 99px;
    background: #1c2942; overflow: hidden; border: 1px solid #2c3d5e;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
  }
  .load-fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #3b82f6, #22d3ee, #a78bfa, #3b82f6);
    background-size: 300% 100%;
    animation: loadShimmer 1.6s linear infinite;
    box-shadow: 0 0 12px rgba(59,130,246,.65);
    transition: width .25s ease;
  }
  @keyframes loadShimmer {
    from { background-position: 0% 0; }
    to { background-position: 300% 0; }
  }
  .load-pct { font-size: 11px; color: #5f7899; font-weight: 800; }
  #trybanner {
    display: none; padding: 7px 12px; background: #2b2308; color: #ffd740;
    font-size: 11px; font-weight: 800; text-align: center; border-top: 2px solid #b8860b;
    padding-bottom: max(7px, env(safe-area-inset-bottom));
  }
  #toast {
    position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px);
    background: #ffd740; color: #1e2333; font-size: 0.78rem; font-weight: 800;
    padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: all 0.25s ease; z-index: 60; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
  <script type="module" crossorigin src="./assets/play-DMwq5WgI.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/firebase-CiHGjH6c.js">
  <link rel="stylesheet" crossorigin href="./assets/firebase-Bk4Cil8H.css">
</head>
<body>
<div id="bar">
  <a href="./" class="pbtn" style="text-decoration:none;">◀</a>
  <div class="t">
    <div class="title" id="p-title">Loading…</div>
    <div class="sub" id="p-sub"></div>
  </div>
  <button class="pbtn gold" id="p-like">🤍 <span id="p-likes">0</span></button>
  <button class="pbtn" id="p-fs">⛶</button>
</div>
<div id="frame-wrap" style="position:relative;">
  <iframe id="gframe" sandbox="allow-scripts allow-pointer-lock allow-modals allow-popups allow-orientation-lock" allowfullscreen></iframe>
  <div id="loading">
    <div class="load-emoji" id="load-emoji">🎮</div>
    <div class="load-title" id="load-title">Game khul raha hai…</div>
    <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
    <div class="load-pct" id="load-pct">0%</div>
  </div>
</div>
<div id="trybanner"></div>
<div id="toast"></div>
</body></html>
