<!DOCTYPE html>

<html lang="hi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#0e1633"/>
<link rel="icon" type="image/svg+xml" href="../../icon.svg"/>
<title>Memory Match 🧠 — Khelog</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,700;6..12,800;6..12,900&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<a id="back-btn" href="../../" aria-label="Home pe wapas jao">←</a>

<div class="wrap">
  <div class="cabinet">
    <div class="badge">🧠 MEMORY MATCH</div>
    <div class="hud">
      <div class="hud-card"><span class="hud-label">MOVES</span><span class="hud-val" id="moves">0</span></div>
      <div class="hud-card"><span class="hud-label">TIME</span><span class="hud-val" id="time">0s</span></div>
      <div class="hud-card"><span class="hud-label">BEST</span><span class="hud-val" id="best">—</span></div>
    </div>
    <div class="mode-row">
      <button class="diff-btn active" data-diff="easy">😊 Easy</button>
      <button class="diff-btn" data-diff="medium">😐 Medium</button>
      <button class="diff-btn" data-diff="hard">😈 Hard</button>
    </div>
    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <div class="overlay-icon" id="ov-icon">🧠</div>
        <h2 id="ov-title">Memory Match</h2>
        <p id="ov-sub">2 same cards dhoondo. Sab match karo!</p>
        <button id="start-btn" class="start-btn">▶ Play</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body></html>
