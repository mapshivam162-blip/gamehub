<!DOCTYPE html>

<html lang="hi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#0e1633"/>
<link rel="icon" type="image/svg+xml" href="../../icon.svg"/>
<title>Space Invaders 👾 — Khelog</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,700;6..12,800;6..12,900&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<a id="back-btn" href="../../" aria-label="Home pe wapas jao">←</a>

<div class="wrap">
  <div class="cabinet">
    <div class="badge">👾 SPACE INVADERS</div>
    <div class="hud">
      <div class="hud-card"><span class="hud-label">SCORE</span><span class="hud-val" id="score">0</span></div>
      <div class="hud-card"><span class="hud-label">BEST</span><span class="hud-val" id="best">0</span></div>
      <div class="hud-card"><span class="hud-label">LIVES</span><span class="hud-val" id="lives">❤️❤️❤️</span></div>
      <div class="hud-card"><span class="hud-label">LEVEL</span><span class="hud-val" id="level">1</span></div>
    </div>
    <div class="game-area">
      <canvas id="board" width="320" height="480"></canvas>    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <div class="overlay-icon" id="ov-icon">👾</div>
        <h2 id="ov-title">Space Invaders</h2>
        <p id="ov-sub">Aliens ko shoot karo, shields bache!</p>
        <button id="start-btn" class="start-btn">▶ Start Game</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js?v=2"></script>
</body></html>
