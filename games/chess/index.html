<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0e1633">
    <title>Chess ♟️ — Khelog</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg">
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,700;6..12,800;6..12,900&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/pieces.css">
    <style>
      #back-btn {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: 12px;
        z-index: 999;
        width: 40px; height: 40px;
        border-radius: 999px;
        background: rgba(255,255,255,0.92);
        border: 2px solid #0b3a5e;
        box-shadow: 0 3px 0 #092c47;
        font-size: 18px; line-height: 1;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        text-decoration: none; color: #0b3a5e;
      }
      #back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #092c47; }
    </style>
</head>
<body>
    <a id="back-btn" href="../../" aria-label="Home pe wapas jao">←</a>

    <div class="wrap">
      <div class="cabinet">
        <div class="badge">♟️ CHESS</div>

        <div class="game-container">
            <div class="board-container">
                <div id="chess-board" class="chess-board" role="grid" aria-label="Chess board">
                    <!-- Board squares generated by JS -->
                </div>
                <div class="captured-row" id="captured-white"></div>
            </div>
            <div class="game-info">
                <div class="mode-row">
                    <button id="mode-2p" class="mode-btn active">👥 2 Player</button>
                    <button id="mode-ai" class="mode-btn">🤖 vs Robot</button>
                </div>
                <div class="diff-row" id="diff-row" style="display:none;">
                    <button class="diff-btn active" data-diff="easy">Easy</button>
                    <button class="diff-btn" data-diff="medium">Medium</button>
                    <button class="diff-btn" data-diff="hard">Hard</button>
                </div>
                <div class="status-bar" id="game-status">White's turn</div>
                <div class="captured-row" id="captured-black"></div>
                <h2>Move History</h2>
                <ul id="move-history" class="move-history"></ul>
                <div class="settings-container">
                    <div class="toggle-container">
                        <span class="toggle-label">Coords</span>
                        <label class="switch">
                            <input type="checkbox" id="coords-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-container">
                        <span class="toggle-label">Moves</span>
                        <label class="switch">
                            <input type="checkbox" id="possible-moves-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-container">
                        <span class="toggle-label">Last move</span>
                        <label class="switch">
                            <input type="checkbox" id="last-move-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="buttons-row">
                    <button id="undo-button" aria-label="Undo last move">Undo</button>
                    <button id="hint-button" aria-label="Hint">💡 Hint</button>
                    <button id="pgn-button" aria-label="Copy PGN">PGN</button>
                    <button id="reset-button">New Game</button>
                </div>
            </div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/board.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
