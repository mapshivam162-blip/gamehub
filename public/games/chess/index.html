<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0e1633">
    <title>Chess ♟️ — GameHub</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/pieces.css">
    <style>
      #back-btn {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: 12px;
        z-index: 999;
        width: 40px; height: 40px;
        border-radius: 999px;
        background: rgba(255,255,255,0.92);
        border: 2px solid #0b3a5e;
        box-shadow: 0 3px 0 #092c47;
        font-size: 18px; line-height: 1;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        text-decoration: none; color: #0b3a5e;
      }
      #back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #092c47; }
    </style>
</head>
<body>
    <a id="back-btn" href="../../" aria-label="Home pe wapas jao">←</a>
        <div class="board-container">
            <h1 class="game-title">Static Chess</h1>
            <div id="chess-board" class="chess-board" role="grid" aria-label="Chess board">
                <!-- Board squares will be generated by JavaScript -->
            </div>
        </div>
        <div class="game-info">
            <h2>Move History</h2>
            <ul id="move-history" class="move-history">
                <!-- Move history will be populated by JavaScript -->
            </ul>
            <div id="game-status" class="game-status" aria-live="polite">
                White's turn
            </div>
            <div class="settings-container">
                <div class="toggle-container">
                    <span class="toggle-label">Show coordinates</span>
                    <label class="switch">
                        <input type="checkbox" id="coords-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-container">
                    <span class="toggle-label">Show possible moves</span>
                    <label class="switch">
                        <input type="checkbox" id="possible-moves-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-container">
                    <span class="toggle-label">Highlight last move</span>
                    <label class="switch">
                        <input type="checkbox" id="last-move-toggle" checked> <!-- Default to checked -->
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-container">
                    <span class="toggle-label">Sound effects</span>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-container">
                    <span class="toggle-label">Flip board</span>
                    <label class="switch">
                        <input type="checkbox" id="flip-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="buttons-row">
                <button id="undo-button" aria-label="Undo last move">Undo</button>
                <button id="pgn-button" aria-label="Copy the game as PGN">Copy PGN</button>
                <button id="reset-button">New Game</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/board.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
